<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style_js.css">
    <title>Calculadora de Média</title>
</head>

<body>

    <header>
        <div class="banner">
            <h1 class="tituloprincipal">
                Calculadora de Média Acadêmica
            </h1>
        </div>
    </header>

    <form id="formularioAcademico">

        <h2>Formulário</h2>

        <div id="blocoNome">

            <label for="nome">Digite seu nome:</label>

            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                required
            >

            <button type="button" id="btnAvancar">
                Avançar
            </button>

        </div>

        <div id="blocoNotas" style="display: none;">

            <label for="nota1">Digite a primeira nota:</label>
            <input type="number" id="nota1" min="0" max="10" step="0.5">

            <br><br>

            <label for="nota2">Digite a segunda nota:</label>
            <input type="number" id="nota2" min="0" max="10" step="0.5">

            <br><br>

            <label for="nota3">Digite a terceira nota:</label>
            <input type="number" id="nota3" min="0" max="10" step="0.5">

            <br><br>

            <button type="button" id="calcular">
                Calcular Média
            </button>

        </div>

        <div id="resultado"></div>

    </form>

    <script>

        document.getElementById("btnAvancar").addEventListener("click", function() {

            const nome = document.getElementById("nome").value.trim();

            if (nome === "") {
                alert("Digite seu nome!");
                return;
            }

            document.getElementById("blocoNome").style.display = "none";

            document.getElementById("blocoNotas").style.display = "block";

        });


        document.getElementById("calcular").addEventListener("click", function() {

            const nome = document.getElementById("nome").value;

            const n1 = document.getElementById("nota1").value;
            const n2 = document.getElementById("nota2").value;
            const n3 = document.getElementById("nota3").value;

            if (n1 === "" || n2 === "" || n3 === "") {
                alert("Preencha todas as notas!");
                return;
            }

            const nota1 = Number(n1);
            const nota2 = Number(n2);
            const nota3 = Number(n3);

            if ([nota1, nota2, nota3].some(n => n < 0 || n > 10)) {
                alert("As notas devem estar entre 0 e 10!");
                return;
            }

            const media = (nota1 + nota2 + nota3) / 3;

            const resultado = document.getElementById("resultado");

            if (media >= 7) {
                resultado.innerHTML = nome + ", você foi aprovado! Sua média é " + media.toFixed(2);
            } else {
                resultado.innerHTML = nome + ", você foi reprovado! Sua média é " + media.toFixed(2);
            }

        });

    </script>

</body>
</html>
